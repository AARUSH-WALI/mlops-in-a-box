name: 🚀 Feature Request
description: Suggest an idea or enhancement for MLOps-in-a-Box
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make MLOps-in-a-Box even better? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the proposed solution
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
