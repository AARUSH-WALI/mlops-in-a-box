name: Deploy Model to Vertex AI

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "GCP Project ID"
        required: true
        type: string
      region:
        description: "GCP Region"
        required: false
        default: "us-central1"
        type: string
      endpoint_id:
        description: "Vertex AI Endpoint ID (leave blank to lookup by display name)"
        required: false
        type: string
      image_tag:
        description: "Serving container image tag"
        required: false
        default: "latest"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  test-build-and-deploy:
    name: Test, Build & Deploy Model
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ inputs.project_id || vars.GCP_PROJECT_ID }}
      REGION: ${{ inputs.region || vars.GCP_REGION || 'us-central1' }}
      WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.GCP_CI_SA_EMAIL }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Serving Dependencies
        run: |
          pip install --upgrade pip
          pip install -r examples/iris-classifier/predict/requirements.txt
          pip install httpx pytest

      - name: Run Prediction Unit Tests
        run: |
          pytest examples/iris-classifier/tests/test_predict.py -v --tb=short

      - name: Authenticate to Google Cloud via WIF
        if: env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        if: env.WIF_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        if: env.WIF_PROVIDER != ''
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push Serving Container
        if: env.WIF_PROVIDER != ''
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/iris-mlbox-containers/iris-predictor:${{ env.IMAGE_TAG }}"
          docker build -t "$IMAGE_URI" examples/iris-classifier/predict/
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Upload Model to Vertex AI Model Registry
        if: env.WIF_PROVIDER != ''
        id: upload-model
        run: |
          MODEL_NAME="iris-classifier-${{ env.IMAGE_TAG }}"
          echo "Uploading model $MODEL_NAME to Vertex AI Model Registry..."

          MODEL_ID=$(gcloud ai models upload \
            --region="${{ env.REGION }}" \
            --display-name="$MODEL_NAME" \
            --container-image-uri="${{ env.IMAGE_URI }}" \
            --container-predict-route="/predict" \
            --container-health-route="/health" \
            --format="value(model)")

          echo "MODEL_ID=$MODEL_ID" >> $GITHUB_ENV
          echo "Model registered successfully with ID: $MODEL_ID"

      - name: Deploy Model to Vertex AI Endpoint
        if: env.WIF_PROVIDER != ''
        run: |
          # Retrieve endpoint ID if not supplied in inputs
          ENDPOINT_ID="${{ inputs.endpoint_id }}"
          if [ -z "$ENDPOINT_ID" ]; then
            ENDPOINT_ID=$(gcloud ai endpoints list \
              --region="${{ env.REGION }}" \
              --filter="displayName=iris-mlbox-endpoint" \
              --format="value(name)" | head -n 1)
          fi

          if [ -z "$ENDPOINT_ID" ]; then
            echo "Error: No endpoint found. Please provision infrastructure with Terraform first."
            exit 1
          fi

          echo "Deploying Model ${{ env.MODEL_ID }} to Endpoint $ENDPOINT_ID..."

          gcloud ai endpoints deploy-model "$ENDPOINT_ID" \
            --region="${{ env.REGION }}" \
            --model="${{ env.MODEL_ID }}" \
            --display-name="deployed-iris-${{ env.IMAGE_TAG }}" \
            --machine-type="n1-standard-2" \
            --min-replica-count=1 \
            --max-replica-count=2 \
            --traffic-split=0=100

          echo "ENDPOINT_ID=$ENDPOINT_ID" >> $GITHUB_ENV

      - name: Run Smoke Test on Deployed Endpoint
        if: env.WIF_PROVIDER != ''
        run: |
          echo "Running smoke test on deployed model..."
          cat << 'EOF' > /tmp/sample_request.json
          {
            "instances": [
              [5.1, 3.5, 1.4, 0.2]
            ]
          }
          EOF

          PREDICTION=$(gcloud ai endpoints predict "${{ env.ENDPOINT_ID }}" \
            --region="${{ env.REGION }}" \
            --json-request=/tmp/sample_request.json)

          echo "Prediction Smoke Test Output:"
          echo "$PREDICTION"

