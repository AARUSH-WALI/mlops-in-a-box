name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-lint:
    name: Terraform Lint & Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - bootstrap
          - network
          - iam
          - registry
          - storage
          - vertex-endpoint
          - monitoring
          - budget

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: modules/${{ matrix.module }}

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: modules/${{ matrix.module }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: modules/${{ matrix.module }}

      - name: TFLint Init
        run: tflint --init
        working-directory: modules/${{ matrix.module }}

      - name: TFLint
        run: tflint --format=compact
        working-directory: modules/${{ matrix.module }}

  security-scan:
    name: Security Scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          checkov \
            --directory modules/ \
            --framework terraform \
            --output cli \
            --output junitxml \
            --output-file-path console,results.xml \
            --config-file tests/security/checkov.yml \
            --soft-fail

      - name: Upload Checkov Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: results.xml

  python-tests:
    name: Python Tests (CLI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CLI dependencies
        run: |
          cd cli
          pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: |
          cd cli
          ruff check .
          ruff format --check .

      - name: Type Check (Mypy)
        run: |
          cd cli
          mypy mlbox/

      - name: Run Tests
        run: |
          cd cli
          pytest tests/ -v --tb=short

  example-tests:
    name: Example Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install example dependencies
        run: |
          cd examples/iris-classifier
          pip install -r train/requirements.txt
          pip install -r predict/requirements.txt
          pip install pytest

      - name: Run example tests
        run: |
          cd examples/iris-classifier
          pytest tests/ -v --tb=short

  terraform-test:
    name: Terraform Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6"

      # Terraform test files use mock providers for unit testing
      # without requiring real GCP credentials
      - name: Run Terraform Tests
        run: |
          for test_file in tests/terraform/*.tftest.hcl; do
            echo "--- Testing: $test_file ---"
            terraform test -test-directory=tests/terraform/ || true
          done

